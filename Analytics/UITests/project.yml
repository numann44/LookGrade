name: LookGradeQA
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
targets:
  LookGradeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lookgrade.analytics-uitests
schemes:
  LookGradeQA:
    build:
      targets:
        LookGradeUITests: [test]
    test:
      targets: [LookGradeUITests]
      gatherCoverageData: false
